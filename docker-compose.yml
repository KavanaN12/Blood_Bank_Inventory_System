services:
  postgres:
    image: postgres:16
    container_name: hemora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bloodbank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hemora_pgdata:/var/lib/postgresql/data

volumes:
  hemora_pgdata:
